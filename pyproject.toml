[project]
name = "hybridrag"
version = "0.1.0"
description = "Hybrid-retrieval RAG over technical documentation, with grounded answers, verified citations, and a measured evaluation suite."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "numpy>=2.1",
    "typer>=0.15",
    "structlog>=24.4",
    "chromadb>=0.5.20",
    "rank-bm25>=0.2.2",
    "pypdf>=5.1",
    "selectolax>=0.3.25",
    "fastembed>=0.8.0",
    "tiktoken>=0.14.0",
    "openai>=3.7.0",
    "google-genai>=2.22.0",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20260815",
    "fastapi>=0.118",
    "uvicorn>=0.34",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hybridrag"]
# Ships the py.typed marker so the package's type hints survive installation.
artifacts = ["src/hybridrag/py.typed"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

# FastAPI's `Depends(...)` in a parameter default is the framework's own dependency-
# injection idiom, not the mutable-default-argument bug B008 exists to catch: the call is
# only ever evaluated once per request, by Starlette, never shared as mutable state.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]
# tests/fixtures holds corpus data, not source: those .py files are inputs to the
# loader, deliberately written as documentation examples rather than typed code.
exclude = "^tests/fixtures/"

# rank_bm25 ships no type stubs. Scoped to that one module rather than relaxing
# strictness globally, so everything else stays fully checked.
[[tool.mypy.overrides]]
module = ["rank_bm25.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    # Touches the real embedding model, so it downloads ~67 MB on a cold cache.
    # Run the fast suite with: pytest -m "not slow"
    "slow: exercises a real model rather than a stand-in",
]
