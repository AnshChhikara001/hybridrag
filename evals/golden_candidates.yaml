- question_id: lookup-005
  category: lookup
  question: Why do I need to use Form when declaring form bodies instead of relying on default parameter
    behavior?
  answer: Because without it the parameters would be interpreted as query parameters or body (JSON)
    parameters.
  spans:
  - relative_path: tutorial/request-forms.md
    quote: '`Form` is a class that inherits directly from `Body`.


      To declare form bodies, you need to use `Form` explicitly, because without it the parameters
      would be interpreted as query parameters or body (JSON) parameters.

      The way HTML forms (``) sends the data to the server normally uses a "special" encoding for
      that data, it''s different from JSON.'
  verified: false
- question_id: lookup-006
  category: lookup
  question: Can I declare both Form parameters and JSON Body fields in the same path operation?
  answer: No, you can't also declare `Body` fields that you expect to receive as JSON, as the request
    will have the body encoded using `application/x-www-form-urlencoded` instead of `application/json`.
  spans:
  - relative_path: tutorial/request-forms.md
    quote: 'You can declare multiple `Form` parameters in a *path operation*, but you can''t also
      declare `Body` fields that you expect to receive as JSON, as the request will have the body
      encoded using `application/x-www-form-urlencoded` instead of `application/json`.


      This is not a limitation of **FastAPI**, it''s part of the HTTP protocol.

      Use `Form` to declare form data input parameters.'
  verified: false
