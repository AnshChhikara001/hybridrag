- question_id: lookup-017
  category: lookup
  question: How do I add tags to group related path operations and have them appear in the OpenAPI
    docs?
  answer: Pass the tags parameter with a list of strings (or Enum members) to the path operation decorator,
    e.g. tags=["items"]
  spans:
  - relative_path: tutorial/path-operation-configuration.md
    quote: "You can add tags to your *path operation*, pass the parameter `tags` with a `list` of\
      \ `str` (commonly just one `str`):\n\n```python\nfrom fastapi import FastAPI\nfrom pydantic\
      \ import BaseModel\n\napp = FastAPI()\n\nclass Item(BaseModel):\n    name: str\n    description:\
      \ str | None = None\n    price: float\n    tax: float | None = None\n    tags: set[str] = set()\n\
      \n@app.post(\"/items/\", response_model=Item, tags=[\"items\"])\nasync def create_item(item:\
      \ Item):\n    return item\n\n@app.get(\"/items/\", tags=[\"items\"])\nasync def read_items():\n\
      \    return [{\"name\": \"Foo\", \"price\": 42}]\n\n@app.get(\"/users/\", tags=[\"users\"])\n\
      async def read_users():\n    return [{\"username\": \"johndoe\"}]\n```\nThey will be added to\
      \ the OpenAPI schema and used by the automatic documentation interfaces:"
  verified: false
