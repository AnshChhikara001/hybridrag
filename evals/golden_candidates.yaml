  question: How do I disable syntax highlighting or change its theme in Swagger UI?
  answer: Either by setting the syntaxHighlight boolean or the syntaxHighlight.theme key in swagger_ui_parameters
    when creating the app or calling get_swagger_ui_html.
  spans:
  - relative_path: how-to/configure-swagger-ui.md
    quote: "But you can disable it by setting `syntaxHighlight` to `False`:\n\n```python\nfrom fastapi\
      \ import FastAPI\n\napp = FastAPI(swagger_ui_parameters={\"syntaxHighlight\": False})\n\n@app.get(\"\
      /users/{username}\")\nasync def read_user(username: str):\n    return {\"message\": f\"Hello\
      \ {username}\"}\n```\n\n...and then Swagger UI won't show the syntax highlighting anymore:"
  - relative_path: how-to/configure-swagger-ui.md
    quote: "The same way you could set the syntax highlighting theme with the key `\"syntaxHighlight.theme\"\
      ` (notice that it has a dot in the middle):\n\n```python\nfrom fastapi import FastAPI\n\napp\
      \ = FastAPI(swagger_ui_parameters={\"syntaxHighlight.theme\": \"obsidian\"})\n\n@app.get(\"\
      /users/{username}\")\nasync def read_user(username: str):\n    return {\"message\": f\"Hello\
      \ {username}\"}\n```\n\nThat configuration would change the syntax highlighting color theme:"
  verified: false
- question_id: ambiguous-002
  category: ambiguous
  question: When should I use PUT versus PATCH to update an item in my API?
  answer: They can both be used; use PUT to replace and PATCH to partially update, depending on whether
    you want full replacement or partial updates.
  spans:
  - relative_path: tutorial/body-updates.md
    quote: "`PUT` is used to receive data that should replace the existing data.\n\nThat means that\
      \ if you want to update the item `bar` using `PUT` with a body containing:\n\n```Python\n{\n\
      \    \"name\": \"Barz\",\n    \"price\": 3,\n    \"description\": None,\n}\n```\n\nbecause it\
      \ doesn't include the already stored attribute `\"tax\": 20.2`, the input model would take the\
      \ default value of `\"tax\": 10.5`.\nAnd the data would be saved with that \"new\" `tax` of\
      \ `10.5`."
  - relative_path: tutorial/body-updates.md
    quote: 'You can also use the HTTP `PATCH` operation to *partially* update data.


      This means that you can send only the data that you want to update, leaving the rest intact.


      `PATCH` is less commonly used and known than `PUT`.


      And many teams use only `PUT`, even for partial updates.


      You are **free** to use them however you want, **FastAPI** doesn''t impose any restrictions.

      But this guide shows you, more or less, how they are intended to be used.'
  verified: false
- question_id: ambiguous-003
  category: ambiguous
  question: What's the recommended secure way to compare the provided username/password to the expected
    values?
  answer: Use secrets.compare_digest on UTF-8 encoded bytes of username and password
  spans:
  - relative_path: advanced/security/http-basic-auth.md
    quote: 'For this, use the Python standard module `secrets` to check the username and password.


      `secrets.compare_digest()` needs to take `bytes` or a `str` that only contains ASCII characters
      (the ones in English), this means it wouldn''t work with characters like `á`, as in `Sebastián`.


      To handle that, we first convert the `username` and `password` to `bytes` encoding them with
      UTF-8.


      Then we can use `secrets.compare_digest()` to ensure that `credentials.username` is `"stanleyjobson"`,
      and that `credentials.password` is `"swordfish"`.'
  - relative_path: advanced/security/http-basic-auth.md
    quote: 'But by using the `secrets.compare_digest()` it will be secure against a type of attacks
      called "timing attacks".


      But what''s a "timing attack"?


      Let''s imagine some attackers are trying to guess the username and password.'
  verified: false
- question_id: ambiguous-004
  category: ambiguous
  question: How do I access the username and password sent by the client inside my path operation?
  answer: Use HTTPBasic dependency which returns HTTPBasicCredentials with username and password
  spans:
  - relative_path: advanced/security/http-basic-auth.md
    quote: "* Import `HTTPBasic` and `HTTPBasicCredentials`.\n* Create a \"`security` scheme\" using\
      \ `HTTPBasic`.\n* Use that `security` with a dependency in your *path operation*.\n* It returns\
      \ an object of type `HTTPBasicCredentials`:\n    * It contains the `username` and `password`\
      \ sent."
  - relative_path: advanced/security/http-basic-auth.md
    quote: "from fastapi import Depends, FastAPI\nfrom fastapi.security import HTTPBasic, HTTPBasicCredentials\n\
      \napp = FastAPI()\n\nsecurity = HTTPBasic()\n\n@app.get(\"/users/me\")\ndef read_current_user(credentials:\
      \ Annotated[HTTPBasicCredentials, Depends(security)]):\n    return {\"username\": credentials.username,\
      \ \"password\": credentials.password}"
  verified: false
- question_id: ambiguous-005
  category: ambiguous
  question: How can I make FastAPI read multiple related headers into a single object for reuse across
    endpoints?
  answer: You can declare a Pydantic model for the headers and use Annotated with Header to have FastAPI
    extract them into that model.
  spans:
  - relative_path: tutorial/header-param-models.md
    quote: 'If you have a group of related **header parameters**, you can create a **Pydantic model**
      to declare them.


      This would allow you to **re-use the model** in **multiple places** and also to declare validations
      and metadata for all the parameters at once. 😎


      This is supported since FastAPI version `0.115.0`. 🤓'
  - relative_path: tutorial/header-param-models.md
    quote: "Declare the **header parameters** that you need in a **Pydantic model**, and then declare\
      \ the parameter as `Header`:\n\n```python\nfrom typing import Annotated\n\nfrom fastapi import\
      \ FastAPI, Header\nfrom pydantic import BaseModel\n\napp = FastAPI()\n\nclass CommonHeaders(BaseModel):\n\
      \    host: str\n    save_data: bool\n    if_modified_since: str | None = None\n    traceparent:\
      \ str | None = None\n    x_tag: list[str] = []\n\n@app.get(\"/items/\")\nasync def read_items(headers:\
      \ Annotated[CommonHeaders, Header()]):\n    return headers\n```"
  verified: false
- question_id: ambiguous-006
  category: ambiguous
  question: What will happen if a client sends headers that aren't defined in my Pydantic header model?
  answer: You can forbid extra fields via model_config so the client will get an error response if
    they send extra headers.
  spans:
  - relative_path: tutorial/header-param-models.md
    quote: 'In some special use cases (probably not very common), you might want to **restrict** the
      headers that you want to receive.


      You can use Pydantic''s model configuration to `forbid` any `extra` fields:'
  - relative_path: tutorial/header-param-models.md
    quote: "If a client tries to send some **extra headers**, they will receive an **error** response.\n\
      \nFor example, if the client tries to send a `tool` header with a value of `plumbus`, they will\
      \ receive an **error** response telling them that the header parameter `tool` is not allowed:\n\
      \n```json\n{\n    \"detail\": [\n        {\n            \"type\": \"extra_forbidden\",\n   \
      \         \"loc\": [\"header\", \"tool\"],\n            \"msg\": \"Extra inputs are not permitted\"\
      ,\n            \"input\": \"plumbus\",\n        }\n    ]\n}\n```"
  verified: false
