- question_id: lookup-019
  category: lookup
  question: How do you define logic to run before the application starts and after it shuts down?
  answer: Use the `lifespan` parameter of the `FastAPI` app with an async context manager (function
    decorated with `@asynccontextmanager`) that yields.
  spans:
  - relative_path: advanced/events.md
    quote: 'You can define logic (code) that should be executed before the application **starts up**.
      This means that this code will be executed **once**, **before** the application **starts receiving
      requests**.


      The same way, you can define logic (code) that should be executed when the application is **shutting
      down**. In this case, this code will be executed **once**, **after** having handled possibly
      **many requests**.


      Because this code is executed before the application **starts** taking requests, and right after
      it **finishes** handling requests, it covers the whole application **lifespan** (the word "lifespan"
      will be important in a second 😉).'
  verified: false
- question_id: lookup-020
  category: lookup
  question: How can you load a shared ML model only once before handling requests?
  answer: Put the model-loading code before the `yield` inside an async context manager used as the
    `lifespan` for the FastAPI app, e.g., populate a shared dict before `yield`.
  spans:
  - relative_path: advanced/events.md
    quote: 'Let''s start with an example **use case** and then see how to solve it with this.


      Let''s imagine that you have some **machine learning models** that you want to use to handle
      requests. 🤖


      The same models are shared among requests, so, it''s not one model per request, or one per user
      or something similar.


      Let''s imagine that loading the model can **take quite some time**, because it has to read a
      lot of **data from disk**. So you don''t want to do it for every request.


      You could load it at the top level of the module/file, but that would also mean that it would
      **load the model** even if you are just running a simple automated test, then that test would
      be **slow** because it would have to wait for the model to load before being able to run an
      independent part of the code.


      That''s what we''ll solve, let''s load the model before the requests are handled, but only right
      before the application starts receiving requests, not while  the code is being loaded.'
  verified: false
- question_id: lookup-021
  category: lookup
  question: What happens to code placed after the `yield` in the lifespan async context manager?
  answer: It is executed after the application has finished handling requests, during shutdown, for
    cleaning up resources.
  spans:
  - relative_path: advanced/events.md
    quote: 'Here we are simulating the expensive *startup* operation of loading the model by putting
      the (fake) model function in the dictionary with machine learning models before the `yield`.
      This code will be executed **before** the application **starts taking requests**, during the
      *startup*.


      And then, right after the `yield`, we unload the model. This code will be executed **after**
      the application **finishes handling requests**, right before the *shutdown*. This could, for
      example, release resources like memory or a GPU.'
  verified: false
- question_id: lookup-022
  category: lookup
  question: How do I convert a Pydantic model and its datetime fields into JSON-compatible Python
    data structures before storing in a database?
  answer: Use FastAPI's jsonable_encoder() to convert the model to JSON-compatible types, e.g., dict
    and ISO-format strings for datetimes.
  spans:
  - relative_path: tutorial/encoder.md
    quote: 'There are some cases where you might need to convert a data type (like a Pydantic model)
      to something compatible with JSON (like a `dict`, `list`, etc).


      For example, if you need to store it in a database.


      For that, **FastAPI** provides a `jsonable_encoder()` function.


      Let''s imagine that you have a database `fake_db` that only receives JSON compatible data.


      For example, it doesn''t receive `datetime` objects, as those are not compatible with JSON.


      So, a `datetime` object would have to be converted to a `str` containing the data in ISO format.


      The same way, this database wouldn''t receive a Pydantic model (an object with attributes),
      only a `dict`.


      You can use `jsonable_encoder` for that.'
  verified: false
- question_id: lookup-023
  category: lookup
  question: What does jsonable_encoder return when given a Pydantic model with datetime fields?
  answer: It returns a Python data structure (like a dict) with values converted to JSON-compatible
    types, such as datetime converted to ISO-format strings.
  spans:
  - relative_path: tutorial/encoder.md
    quote: 'In this example, it would convert the Pydantic model to a `dict`, and the `datetime` to
      a `str`.


      The result of calling it is something that can be encoded with the Python standard `json.dumps()`.


      It doesn''t return a large `str` containing the data in JSON format (as a string). It returns
      a Python standard data structure (e.g. a `dict`) with values and sub-values that are all compatible
      with JSON.'
  verified: false
- question_id: lookup-024
  category: lookup
  question: When is jsonable_encoder used within FastAPI and why might I want to call it manually?
  answer: FastAPI uses jsonable_encoder internally to convert data, but you can call it manually when
    you need JSON-compatible Python data structures for tasks like storing in a database.
  spans:
  - relative_path: tutorial/encoder.md
    quote: '`jsonable_encoder` is actually used by **FastAPI** internally to convert data. But it
      is useful in many other scenarios.'
  verified: false
- question_id: multi_hop-001
  category: multi_hop
  question: How would I ensure a machine-learning model loaded in a FastAPI app during the asynccontextmanager
    lifespan is available across multiple OS processes when using a separate program that restarts
    and manages the Uvicorn process on server startup?
  answer: This requires combining app lifespan resource loading with an external process manager that
    handles starting/restarting multiple OS processes, because lifespan runs per process and process
    managers handle restarts and replication.
  spans:
  - relative_path: deployment/concepts.md
    quote: 'When you set up a remote server (a cloud server, a virtual machine, etc.) the simplest
      thing you can do is use `fastapi run` (which uses Uvicorn) or something  similar, manually,
      the same way you do when developing locally.


      And it will work and will be useful **during development**.


      But if your connection to the server is lost, the **running process** will probably die.


      And if the server is restarted (for example after updates, or migrations from the cloud provider)
      you probably **won''t notice it**. And because of that, you won''t even know that you have to
      restart the process manually. So, your API will just stay dead. 😱


      In general, you will probably want the server program (e.g. Uvicorn) to be started automatically
      on server startup, and without needing any **human intervention**, to have a process always
      running with your API (e.g. Uvicorn running your FastAPI app).


      To achieve this, you will normally have a **separate program** that would make sure your applicatio'
  - relative_path: advanced/events.md
    quote: 'You can define logic (code) that should be executed before the application **starts up**.
      This means that this code will be executed **once**, **before** the application **starts receiving
      requests**.


      The same way, you can define logic (code) that should be executed when the application is **shutting
      down**. In this case, this code will be executed **once**, **after** having handled possibly
      **many requests**.


      Because this code is executed before the application **starts** taking requests, and right after
      it **finishes** handling requests, it covers the whole application **lifespan** (the word "lifespan"
      will be important in a second 😉).


      This can be very useful for setting up **resources** that you need to use for the whole app,
      and that are **shared** among requests, and/or that you need to **clean up** afterwards. For
      example, a database connection pool, or loading a shared machine learning model.'
  verified: false
- question_id: multi_hop-002
  category: multi_hop
  question: If I mount a sub-application at /subapi and also run behind a proxy that serves the app
    under /api/v1, how will the sub-application know to use the combined prefix so its docs UI is
    fetched from /api/v1/subapi/docs?
  answer: 'You must rely on ASGI root_path handling: FastAPI sets root_path for mounted sub-apps and
    the server/proxy can pass an external root_path so the browser-facing docs use the combined prefix.'
  spans:
  - relative_path: advanced/sub-applications.md
    quote: 'When you mount a sub-application as described above, FastAPI will take care of communicating
      the mount path for the sub-application using a mechanism from the ASGI specification called
      a `root_path`.

      That way, the sub-application will know to use that path prefix for the docs UI.

      And the sub-application could also have its own mounted sub-applications and everything would
      work correctly, because FastAPI handles all these `root_path`s automatically.

      You will learn more about the `root_path` and how to use it explicitly in the section about
      [Behind a Proxy](behind-a-proxy.md){.internal-link target=_blank}.'
  - relative_path: advanced/behind-a-proxy.md
    quote: 'The `root_path` is a mechanism provided by the ASGI specification (that FastAPI is built
      on, through Starlette).


      The `root_path` is used to handle these specific cases.


      And it''s also used internally when mounting sub-applications.


      Having a proxy with a stripped path prefix, in this case, means that you could declare a path
      at `/app` in your code, but then, you add a layer on top (the proxy) that would put your **FastAPI**
      application under a path like `/api/v1`.


      In this case, the original path `/app` would actually be served at `/api/v1/app`.


      Even though all your code is written assuming there''s just `/app`.'
  verified: false
- question_id: multi_hop-003
  category: multi_hop
  question: How do I document an external API callback path operation that uses an APIRouter and then
    include that router's routes in a FastAPI path operation decorator while also keeping the application's
    routers organized across multiple files?
  answer: You create the callback APIRouter with the callback path operation and pass its .routes
    to the FastAPI path operation decorator as callbacks, while organizing other app path operations
    into APIRouter instances in separate modules and including them in the main app.
  spans:
  - relative_path: advanced/openapi-callbacks.md
    quote: 'The only new thing is the `callbacks=invoices_callback_router.routes` as an argument to
      the *path operation decorator*. We''ll see what that is next.


      The actual callback code will depend heavily on your own API app.


      And it will probably vary a lot from one app to the next.


      It could be just one or two lines of code, like:


      ```Python

      callback_url = "https://example.com/api/v1/invoices/events/"

      httpx.post(callback_url, json={"description": "Invoice paid", "paid": True})

      ```


      But possibly the most important part of the callback is making sure that your API user (the
      external developer) implements the *external API* correctly, according to the data that *your
      API* is going to send in the request body of the callback, etc.'
  - relative_path: tutorial/bigger-applications.md
    quote: 'You can think of `APIRouter` as a "mini `FastAPI`" class.


      All the same options are supported.


      All the same `parameters`, `responses`, `dependencies`, `tags`, etc.


      In this example, the variable is called `router`, but you can name it however you want.


      We are going to include this `APIRouter` in the main `FastAPI` app, but first, let''s check
      the dependencies and another `APIRouter`.'
  verified: false
- question_id: multi_hop-004
  category: multi_hop
  question: How do I declare a group of cookie parameters as a reusable Pydantic model and then have
    FastAPI extract those cookie fields when handling a request?
  answer: Use a Pydantic model with cookie fields and annotate the parameter with Cookie(), e.g.,
    Annotated[Cookies, Cookie()].
  spans:
  - relative_path: tutorial/cookie-param-models.md
    quote: "If you have a group of **cookies** that are related, you can create a **Pydantic model**\
      \ to declare them. \U0001F36A\n\nThis would allow you to **re-use the model** in **multiple\
      \ places** and also to declare validations and metadata for all the parameters at once. \U0001F60E\
      \n\nThis is supported since FastAPI version `0.115.0`. \U0001F913\n\nThis same technique applies\
      \ to `Query`, `Cookie`, and `Header`. \U0001F60E\n\nDeclare the **cookie** parameters that you\
      \ need in a **Pydantic model**, and then declare the parameter as `Cookie`:\n\n```python\nfrom\
      \ typing import Annotated\n\nfrom fastapi import Cookie, FastAPI\nfrom pydantic import BaseModel\n\
      \napp = FastAPI()\n\nclass Cookies(BaseModel):\n    session_id: str\n    fatebook_tracker: str\
      \ | None = None\n    googall_tracker: str | None = None\n\n@app.get(\"/items/\")\nasync def\
      \ read_items(cookies: Annotated[Cookies, Cookie()]):\n    return cookies\n```"
  - relative_path: tutorial/cookie-params.md
    quote: "You can define Cookie parameters the same way you define `Query` and `Path` parameters.\n\
      \nFirst import `Cookie`:\n\n```python\nfrom typing import Annotated\n\nfrom fastapi import Cookie,\
      \ FastAPI\n\napp = FastAPI()\n\n@app.get(\"/items/\")\nasync def read_items(ads_id: Annotated[str\
      \ | None, Cookie()] = None):\n    return {\"ads_id\": ads_id}\n```\n\nThen declare the cookie\
      \ parameters using the same structure as with `Path` and `Query`.\n\nYou can define the default\
      \ value as well as all the extra validation or annotation parameters:\n\n```python\nfrom typing\
      \ import Annotated\n\nfrom fastapi import Cookie, FastAPI\n\napp = FastAPI()\n\n@app.get(\"\
      /items/\")\nasync def read_items(ads_id: Annotated[str | None, Cookie()] = None):\n    return\
      \ {\"ads_id\": ads_id}\n```\n\n`Cookie` is a \"sister\" class of `Path` and `Query`. It also\
      \ inherits from the same common `Param` class.\n\nBut remember that when you import `Query`,\
      \ `Path`, `Cookie` and others from `fastapi`, those are actually functions that return special\
      \ classes.\n\nTo declare cookies, you need to use `Cookie`, because otherwise the parameters\
      \ would be interpreted as query parameters.\n\nDeclare cookies with `Cookie`, using the same\
      \ common pattern as `Query` and `Path`."
  verified: false
- question_id: multi_hop-005
  category: multi_hop
  question: If I want to accept partial updates without accidentally overwriting stored fields with
    model defaults and also ensure the response is validated and filtered by a Pydantic model when
    returning the updated item, what combination of techniques from both endpoints should I apply?
  answer: Use PATCH with exclude_unset to build update_data and model_copy/update on stored model,
    then return it with a response_model so FastAPI validates and filters the returned data.
  spans:
  - relative_path: tutorial/body-updates.md
    quote: 'If you want to receive partial updates, it''s very useful to use the parameter `exclude_unset`
      in Pydantic''s model''s `.model_dump()`.


      Like `item.model_dump(exclude_unset=True)`.


      In Pydantic v1 the method was called `.dict()`, it was deprecated (but still supported) in Pydantic
      v2, and renamed to `.model_dump()`.


      The examples here use `.dict()` for compatibility with Pydantic v1, but you should use `.model_dump()`
      instead if you can use Pydantic v2.


      That would generate a `dict` with only the data that was set when creating the `item` model,
      excluding default values.


      Then you can use this to generate a `dict` with only the data that was set (sent in the request),
      omitting default values:'
  - relative_path: tutorial/response-model.md
    quote: 'FastAPI will use this `response_model` to do all the data documentation, validation, etc.
      and also to **convert and filter the output data** to its type declaration.


      If you have strict type checks in your editor, mypy, etc, you can declare the function return
      type as `Any`.


      That way you tell the editor that you are intentionally returning anything. But FastAPI will
      still do the data documentation, validation, filtering, etc. with the `response_model`.'
  verified: false
- question_id: multi_hop-006
  category: multi_hop
  question: If I mount a StaticFiles instance at "/static" on my main FastAPI app and also mount a
    separate FastAPI sub-application at "/subapi", will the OpenAPI docs at "/docs" include the static
    files mount or the sub-application's path operations?
  answer: 'You must combine both behaviors: mounted static files are a mounted sub-application and
    mounted sub-applications (including StaticFiles) are independent, so the main app''s docs won''t
    include them.'
  spans:
  - relative_path: tutorial/static-files.md
    quote: 'You can serve static files automatically from a directory using `StaticFiles`.


      * Import `StaticFiles`.

      * "Mount" a `StaticFiles()` instance in a specific path.


      ```python

      from fastapi import FastAPI

      from fastapi.staticfiles import StaticFiles


      app = FastAPI()


      app.mount("/static", StaticFiles(directory="static"), name="static")

      ```


      You could also use `from starlette.staticfiles import StaticFiles`.


      **FastAPI** provides the same `starlette.staticfiles` as `fastapi.staticfiles` just as a convenience
      for you, the developer. But it actually comes directly from Starlette.


      "Mounting" means adding a complete "independent" application in a specific path, that then takes
      care of handling all the sub-paths.


      This is different from using an `APIRouter` as a mounted application is completely independent.
      The OpenAPI and docs from your main application won''t include anything from the mounted application,
      etc.


      You can read more about this in the [Advanced User Guide](../advanced/index.md){.internal-link
      target=_blank}.'
  - relative_path: advanced/sub-applications.md
    quote: "\"Mounting\" means adding a completely \"independent\" application in a specific path,\
      \ that then takes care of handling everything under that path, with the _path operations_ declared\
      \ in that sub-application.\n\nFirst, create the main, top-level, **FastAPI** application, and\
      \ its *path operations*:\n\n```python\nfrom fastapi import FastAPI\n\napp = FastAPI()\n\n@app.get(\"\
      /app\")\ndef read_main():\n    return {\"message\": \"Hello World from main app\"}\n\nsubapi\
      \ = FastAPI()\n\n@subapi.get(\"/sub\")\ndef read_sub():\n    return {\"message\": \"Hello World\
      \ from sub API\"}\n\napp.mount(\"/subapi\", subapi)\n```\n\nThen, create your sub-application,\
      \ and its *path operations*.\n\nThis sub-application is just another standard FastAPI application,\
      \ but this is the one that will be \"mounted\":\n\n```python\nfrom fastapi import FastAPI\n\n\
      app = FastAPI()\n\n@app.get(\"/app\")\ndef read_main():\n    return {\"message\": \"Hello World\
      \ from main app\"}\n\nsubapi = FastAPI()\n\n@subapi.get(\"/sub\")\ndef read_sub():\n    return\
      \ {\"message\": \"Hello World from sub API\"}\n\napp.mount(\"/subapi\", subapi)\n```\n\nIn your\
      \ top-level application, `app`, mount the sub-application, `subapi`.\n\nIn this case, it will\
      \ be mounted at the path `/subapi`:\n\n```python\nfrom fastapi import FastAPI\n\napp = FastAPI()\n\
      \n@app.get(\"/app\")\ndef read_main():\n    return {\"message\": \"Hello World from main app\"\
      }\n\nsubapi = FastAPI()\n\n@subapi.get(\"/sub\")\ndef read_sub():\n    return {\"message\":\
      \ \"Hello World from sub API\"}\n\napp.mount(\"/subapi\", subapi)\n```\n\nNow, run the `fastapi`\
      \ command with your file:\n\n```console\n$ fastapi dev main.py\n\n<span style=\"color: green;\"\
      >INFO</span>:     Uvicorn running on http://127.0.0.1:8000 (Press CTRL+C to quit)\n```\n\nAnd\
      \ open the docs at http://127.0.0.1:8000/docs.\n\nYou will see the automatic API docs for the\
      \ main app, including only its own _path operations_:\n\nAnd then, open the docs for the sub-application,\
      \ at http://127.0.0.1:8000/subapi/docs.\n\nYou will see the automatic API docs for the sub-application,\
      \ including only its own _path operations_, all under the correct sub-path prefix `/subapi`:\n\
      \nIf you try interacting with any of the two user interfaces, they will work correctly, because\
      \ the browser will be able to talk to each specific app or sub-app."
  verified: false
- question_id: multi_hop-007
  category: multi_hop
  question: How can I both add a license identifier like "MIT" to my OpenAPI metadata and link to
    further docs about adding metadata and docs URLs from within the same FastAPI app?
  answer: You set license_info with an identifier in FastAPI's constructor and reference the tutorial
    link for adding metadata and docs URLs.
  spans:
  - relative_path: tutorial/metadata.md
    quote: "Since OpenAPI 3.1.0 and FastAPI 0.99.0, you can also set the `license_info` with an `identifier`\
      \ instead of a `url`.\n\nFor example:\n\n```python\nfrom fastapi import FastAPI\n\ndescription\
      \ = \"\"\"\nChimichangApp API helps you do awesome stuff. \U0001F680\n\n## Items\n\nYou can\
      \ **read items**.\n\n## Users\n\nYou will be able to:\n\n* **Create users** (_not implemented_).\n\
      * **Read users** (_not implemented_).\n\"\"\"\n\napp = FastAPI(\n    title=\"ChimichangApp\"\
      ,\n    description=description,\n    summary=\"Deadpool's favorite app. Nuff said.\",\n    version=\"\
      0.0.1\",\n    terms_of_service=\"http://example.com/terms/\",\n    contact={\n        \"name\"\
      : \"Deadpoolio the Amazing\",\n        \"url\": \"http://x-force.example.com/contact/\",\n \
      \       \"email\": \"dp@x-force.example.com\",\n    },\n    license_info={\n        \"name\"\
      : \"Apache 2.0\",\n        \"identifier\": \"MIT\",\n    },\n)\n\n@app.get(\"/items/\")\nasync\
      \ def read_items():\n    return [{\"name\": \"Katana\"}]\n```"
  - relative_path: how-to/general.md
    quote: 'To add metadata to your OpenAPI schema, including a license, version, contact, etc, read
      the docs for [Tutorial - Metadata and Docs URLs](../tutorial/metadata.md){.internal-link target=_blank}.


      To customize the OpenAPI URL (or remove it), read the docs for [Tutorial - Metadata and Docs
      URLs](../tutorial/metadata.md#openapi-url){.internal-link target=_blank}.


      To update the URLs used for the automatically generated docs user interfaces, read the docs
      for [Tutorial - Metadata and Docs URLs](../tutorial/metadata.md#docs-urls){.internal-link target=_blank}.'
  verified: false
- question_id: multi_hop-008
  category: multi_hop
  question: If I want to both set cookies in a response and have the response documented in OpenAPI
    with a specific media type, how can I both set cookies and ensure the response_class media type
    is included in the automatic docs?
  answer: You declare a Response parameter (or return a Response) to set cookies and also set response_class
    in the path operation decorator so FastAPI can document the media type in OpenAPI.
  spans:
  - relative_path: advanced/response-cookies.md
    quote: "You can declare a parameter of type `Response` in your *path operation function*.\n\n\
      And then you can set cookies in that *temporal* response object.\n\n```python\nfrom fastapi\
      \ import FastAPI, Response\n\napp = FastAPI()\n\n@app.post(\"/cookie-and-object/\")\ndef create_cookie(response:\
      \ Response):\n    response.set_cookie(key=\"fakesession\", value=\"fake-cookie-session-value\"\
      )\n    return {\"message\": \"Come to the dark side, we have cookies\"}\n```\n\nAnd then you\
      \ can return any object you need, as you normally would (a `dict`, a database model, etc).\n\
      \nAnd if you declared a `response_model`, it will still be used to filter and convert the object\
      \ you returned.\n\n**FastAPI** will use that *temporal* response to extract the cookies (also\
      \ headers and status code), and will put them in the final response that contains the value\
      \ you returned, filtered by any `response_model`.\n\nYou can also declare the `Response` parameter\
      \ in dependencies, and set cookies (and headers) in them.\n\nYou can also create cookies when\
      \ returning a `Response` directly in your code.\n\nTo do that, you can create a response as\
      \ described in [Return a Response Directly](response-directly.md){.internal-link target=_blank}.\n\
      \nThen set Cookies in it, and then return it:"
  - relative_path: advanced/custom-response.md
    quote: "If you want to override the response from inside of the function but at the same time\
      \ document the \"media type\" in OpenAPI, you can use the `response_class` parameter AND return\
      \ a `Response` object.\n\nThe `response_class` will then be used only to document the OpenAPI\
      \ *path operation*, but your `Response` will be used as is.\n\nFor example, it could be something\
      \ like:\n\n```python\nfrom fastapi import FastAPI\nfrom fastapi.responses import HTMLResponse\n\
      \napp = FastAPI()\n\ndef generate_html_response():\n    html_content = \"\"\"\n    <html>\n\
      \        <head>\n            <title>Some HTML in here</title>\n        </head>\n        <body>\n\
      \            <h1>Look ma! HTML!</h1>\n        </body>\n    </html>\n    \"\"\"\n    return HTMLResponse(content=html_content,\
      \ status_code=200)\n\n@app.get(\"/items/\", response_class=HTMLResponse)\nasync def read_items():\n\
      \    return generate_html_response()\n```"
  verified: false
- question_id: multi_hop-009
  category: multi_hop
  question: How can I send both files and a token in the same multipart/form-data request so the files
    can be received as UploadFile and a small text field as Form?
  answer: You declare files with File/UploadFile and form fields with Form together in the same path
    operation so FastAPI reads them from multipart/form-data.
  spans:
  - relative_path: tutorial/request-files.md
    quote: 'But remember that when you import `Query`, `Path`, `File` and others from `fastapi`, those
      are actually functions that return special classes.


      To declare File bodies, you need to use `File`, because otherwise the parameters would be interpreted
      as query parameters or body (JSON) parameters.


      The files will be uploaded as "form data".

      If you declare the type of your *path operation function* parameter as `bytes`, **FastAPI**
      will read the file for you and you will receive the contents as `bytes`.


      Keep in mind that this means that the whole contents will be stored in memory. This will work
      well for small files.'
  - relative_path: tutorial/request-forms-and-files.md
    quote: "You can define files and form fields at the same time using `File` and `Form`.\n\nTo receive\
      \ uploaded files and/or form data, first install `python-multipart`.\n\nMake sure you create\
      \ a [virtual environment](../virtual-environments.md){.internal-link target=_blank}, activate\
      \ it, and then install it, for example:\n\n```console\n$ pip install python-multipart\n```\n\
      \n```python\nfrom typing import Annotated\n\nfrom fastapi import FastAPI, File, Form, UploadFile\n\
      \napp = FastAPI()\n\n@app.post(\"/files/\")\nasync def create_file(\n    file: Annotated[bytes,\
      \ File()],\n    fileb: Annotated[UploadFile, File()],\n    token: Annotated[str, Form()],\n\
      ):\n    return {\n        \"file_size\": len(file),\n        \"token\": token,\n        \"fileb_content_type\"\
      : fileb.content_type,\n    }\n```"
  verified: false
- question_id: multi_hop-010
  category: multi_hop
  question: How can I both set a custom response status code for creating an item and also access
    its attributes to compute and return a derived field like price_with_tax?
  answer: By using a path operation decorator with status_code (e.g., status.HTTP_201_CREATED) and
    declaring a Pydantic model parameter so you can use item.dict() and compute price_with_tax inside
    the function.
  spans:
  - relative_path: tutorial/path-operation-configuration.md
    quote: "You can define the (HTTP) `status_code` to be used in the response of your *path operation*.\n\
      \nYou can pass directly the `int` code, like `404`.\n\nBut if you don't remember what each number\
      \ code is for, you can use the shortcut constants in `status`:\n\n```python\nfrom fastapi import\
      \ FastAPI, status\nfrom pydantic import BaseModel\n\napp = FastAPI()\n\nclass Item(BaseModel):\n\
      \    name: str\n    description: str | None = None\n    price: float\n    tax: float | None\
      \ = None\n    tags: set[str] = set()\n\n@app.post(\"/items/\", response_model=Item, status_code=status.HTTP_201_CREATED)\n\
      async def create_item(item: Item):\n    return item\n```"
  - relative_path: tutorial/body.md
    quote: "Inside of the function, you can access all the attributes of the model object directly:\n\
      \n```python\nfrom fastapi import FastAPI\nfrom pydantic import BaseModel\n\nclass Item(BaseModel):\n\
      \    name: str\n    description: str | None = None\n    price: float\n    tax: float | None\
      \ = None\n\napp = FastAPI()\n\n@app.post(\"/items/\")\nasync def create_item(item: Item):\n\
      \    item_dict = item.dict()\n    if item.tax:\n        price_with_tax = item.price + item.tax\n\
      \        item_dict.update({\"price_with_tax\": price_with_tax})\n    return item_dict\n```"
  verified: false
- question_id: multi_hop-011
  category: multi_hop
  question: If I set a default status_code on a path operation but in some cases need to change it
    dynamically while still having FastAPI apply a response_model to the returned object, how can
    I do that?
  answer: Declare a parameter of type Response in the path operation function (or in a dependency),
    modify response.status_code as needed, and return the object; FastAPI will use the temporal Response
    to set the final status and still apply the response_model.
  spans:
  - relative_path: tutorial/response-status-code.md
    quote: "You can use the convenience variables from `fastapi.status`.\n\n```python\nfrom fastapi\
      \ import FastAPI, status\n\napp = FastAPI()\n\n@app.post(\"/items/\", status_code=status.HTTP_201_CREATED)\n\
      async def create_item(name: str):\n    return {\"name\": name}\n```\n\nThey are just a convenience,\
      \ they hold the same number, but that way you can use the editor's autocomplete to find them:\n\
      \nYou could also use `from starlette import status`.\n\n**FastAPI** provides the same `starlette.status`\
      \ as `fastapi.status` just as a convenience for you, the developer. But it comes directly from\
      \ Starlette."
  - relative_path: advanced/response-change-status-code.md
    quote: "You probably read before that you can set a default [Response Status Code](../tutorial/response-status-code.md){.internal-link\
      \ target=_blank}.\n\nBut in some cases you need to return a different status code than the default.\n\
      \nFor example, imagine that you want to return an HTTP status code of \"OK\" `200` by default.\n\
      \nBut if the data didn't exist, you want to create it, and return an HTTP status code of \"\
      CREATED\" `201`.\n\nBut you still want to be able to filter and convert the data you return\
      \ with a `response_model`.\n\nFor those cases, you can use a `Response` parameter.\n\nYou can\
      \ declare a parameter of type `Response` in your *path operation function* (as you can do for\
      \ cookies and headers).\n\nAnd then you can set the `status_code` in that *temporal* response\
      \ object.\n\n```python\nfrom fastapi import FastAPI, Response, status\n\napp = FastAPI()\n\n\
      tasks = {\"foo\": \"Listen to the Bar Fighters\"}\n\n@app.put(\"/get-or-create-task/{task_id}\"\
      , status_code=200)\ndef get_or_create_task(task_id: str, response: Response):\n    if task_id\
      \ not in tasks:\n        tasks[task_id] = \"This didn't exist before\"\n        response.status_code\
      \ = status.HTTP_201_CREATED\n    return tasks[task_id]\n```\n\nAnd then you can return any object\
      \ you need, as you normally would (a `dict`, a database model, etc).\n\nAnd if you declared\
      \ a `response_model`, it will still be used to filter and convert the object you returned.\n\
      \n**FastAPI** will use that *temporal* response to extract the status code (also cookies and\
      \ headers), and will put them in the final response that contains the value you returned, filtered\
      \ by any `response_model`.\n\nYou can also declare the `Response` parameter in dependencies,\
      \ and set the status code in them. But keep in mind that the last one to be set will win."
  verified: false
- question_id: multi_hop-012
  category: multi_hop
  question: How do I declare an optional string query parameter with a maximum length of 50 characters
    while keeping the default value None and using Annotated?
  answer: 'You should use Annotated with Query, for example: q: Annotated[str | None, Query(max_length=50)]
    = None'
  spans:
  - relative_path: tutorial/query-params.md
    quote: 'In this case, the function parameter `q` will be optional, and will be `None` by default.


      Also notice that **FastAPI** is smart enough to notice that the path parameter `item_id` is
      a path parameter and `q` is not, so, it''s a query parameter.'
  - relative_path: tutorial/query-params-str-validations.md
    quote: "from typing import Annotated\n\nfrom fastapi import FastAPI, Query\n\napp = FastAPI()\n\
      \n@app.get(\"/items/\")\nasync def read_items(q: Annotated[str | None, Query(max_length=50)]\
      \ = None):\n    results = {\"items\": [{\"item_id\": \"Foo\"}, {\"item_id\": \"Bar\"}]}\n  \
      \  if q:\n        results.update({\"q\": q})\n    return results"
  verified: false
- question_id: multi_hop-013
  category: multi_hop
  question: How can I both set Field-level validation like gt=0 for a price attribute and also include
    multiple example bodies for that same model in the OpenAPI docs returned by FastAPI?
  answer: 'You use Pydantic''s Field on the model attribute for validations (e.g., price: float =
    Field(gt=0, ...)) and provide examples either via model json_schema_extra or Field/examples or
    via Body(examples=[...]) when declaring the request body.'
  spans:
  - relative_path: tutorial/body-fields.md
    quote: "Notice that `Field` is imported directly from `pydantic`, not from `fastapi` as are all\
      \ the rest (`Query`, `Path`, `Body`, etc).\n\nYou can then use `Field` with model attributes:\n\
      \n```python\nfrom typing import Annotated\n\nfrom fastapi import Body, FastAPI\nfrom pydantic\
      \ import BaseModel, Field\n\napp = FastAPI()\n\nclass Item(BaseModel):\n    name: str\n    description:\
      \ str | None = Field(\n        default=None, title=\"The description of the item\", max_length=300\n\
      \    )\n    price: float = Field(gt=0, description=\"The price must be greater than zero\")\n\
      \    tax: float | None = None\n\n@app.put(\"/items/{item_id}\")\nasync def update_item(item_id:\
      \ int, item: Annotated[Item, Body(embed=True)]):\n    results = {\"item_id\": item_id, \"item\"\
      : item}\n    return results\n```"
  - relative_path: tutorial/schema-extra-example.md
    quote: "When using any of:\n\n* `Path()`\n* `Query()`\n* `Header()`\n* `Cookie()`\n* `Body()`\n\
      * `Form()`\n* `File()`\n\nyou can also declare a group of `examples` with additional information\
      \ that will be added to their **JSON Schemas** inside of **OpenAPI**.\n\nHere we pass `examples`\
      \ containing one example of the data expected in `Body()`:\n\n```python\nfrom typing import\
      \ Annotated\n\nfrom fastapi import Body, FastAPI\nfrom pydantic import BaseModel\n\napp = FastAPI()\n\
      \nclass Item(BaseModel):\n    name: str\n    description: str | None = None\n    price: float\n\
      \    tax: float | None = None\n\n@app.put(\"/items/{item_id}\")\nasync def update_item(\n  \
