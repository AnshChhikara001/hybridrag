questions:
- question_id: lookup-001
  category: lookup
  question: How does the OAuth2 scopes mechanism describe the format and purpose of scopes?
  answer: Scopes are described as a list of strings separated by spaces that represent permissions,
    and each scope is just a string without spaces.
  spans:
  - relative_path: advanced/security/oauth2-scopes.md
    quote: 'The OAuth2 specification defines "scopes" as a list of strings separated by spaces.


      The content of each of these strings can have any format, but should not contain spaces.


      These scopes represent "permissions".

      In OpenAPI (e.g. the API docs), you can define "security schemes".

      When one of these security schemes uses OAuth2, you can also declare and use scopes.

      Each "scope" is just a string (without spaces).

      They are normally used to declare specific security permissions, for example:

      * `users:read` or `users:write` are common examples.

      * `instagram_basic` is used by Facebook / Instagram.

      * `https://www.googleapis.com/auth/drive` is used by Google.'
  verified: false
- question_id: lookup-002
  category: lookup
  question: Where do Query, Path and Body come from and what do they return?
  answer: Remember that when you import `Query`, `Path`, and others from `fastapi`, those are actually
    functions that return special classes.
  spans:
  - relative_path: tutorial/body-fields.md
    quote: 'Actually, `Query`, `Path` and others you''ll see next create objects of subclasses of
      a common `Param` class, which is itself a subclass of Pydantic''s `FieldInfo` class.


      And Pydantic''s `Field` returns an instance of `FieldInfo` as well.


      `Body` also returns objects of a subclass of `FieldInfo` directly. And there are others you
      will see later that are subclasses of the `Body` class.'
  verified: false
