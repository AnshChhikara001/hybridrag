- question_id: multi_hop-014
  category: multi_hop
  question: How should I annotate a function parameter to accept both form fields and uploaded files
    in the same POST endpoint and why can't I also expect JSON Body fields in that endpoint?
  answer: Use File and Form (e.g., Annotated[bytes, File()] and Annotated[str, Form()]) together because
    the request will be encoded as multipart/form-data, so you cannot declare Body fields expecting
    application/json in the same operation.
  spans:
  - relative_path: tutorial/request-forms-and-files.md
    quote: "To receive uploaded files and/or form data, first install `python-multipart`.\n\nMake\
      \ sure you create a [virtual environment](../virtual-environments.md){.internal-link target=_blank},\
      \ activate it, and then install it, for example:\n\n```console\n$ pip install python-multipart\n\
      ```\n\n```python\nfrom typing import Annotated\n\nfrom fastapi import FastAPI, File, Form, UploadFile\n\
      \napp = FastAPI()\n\n@app.post(\"/files/\")\nasync def create_file(\n    file: Annotated[bytes,\
      \ File()],\n    fileb: Annotated[UploadFile, File()],\n    token: Annotated[str, Form()],\n\
      ):\n    return {\n        \"file_size\": len(file),\n        \"token\": token,\n        \"fileb_content_type\"\
      : fileb.content_type,\n    }\n```"
  - relative_path: tutorial/request-files.md
    quote: 'You can declare multiple `File` and `Form` parameters in a *path operation*, but you can''t
      also declare `Body` fields that you expect to receive as JSON, as the request will have the
      body encoded using `multipart/form-data` instead of `application/json`.


      This is not a limitation of **FastAPI**, it''s part of the HTTP protocol.'
  verified: false
- question_id: multi_hop-015
  category: multi_hop
  question: If I want to set both a custom header and a cookie in a path operation, and have FastAPI
    include them along with a response_model-filtered JSON body, can I set them using a single Response
    parameter and will FastAPI extract both headers and cookies from that temporal response into the
    final response?
  answer: 'Yes'
  spans:
  - relative_path: advanced/response-headers.md
    quote: "You can declare a parameter of type `Response` in your *path operation function* (as you\
      \ can do for cookies).\n\nAnd then you can set headers in that *temporal* response object.\n\
      \n```python\nfrom fastapi import FastAPI, Response\n\napp = FastAPI()\n\n@app.get(\"/headers-and-object/\"\
      )\ndef get_headers(response: Response):\n    response.headers[\"X-Cat-Dog\"] = \"alone in the\
      \ world\"\n    return {\"message\": \"Hello World\"}\n```\n\nAnd then you can return any object\
      \ you need, as you normally would (a `dict`, a database model, etc).\n\nAnd if you declared\
      \ a `response_model`, it will still be used to filter and convert the object you returned.\n\
      \n**FastAPI** will use that *temporal* response to extract the headers (also cookies and status\
      \ code), and will put them in the final response that contains the value you returned, filtered\
      \ by any `response_model`."
  - relative_path: advanced/response-cookies.md
    quote: "You can declare a parameter of type `Response` in your *path operation function*.\n\n\
      And then you can set cookies in that *temporal* response object.\n\n```python\nfrom fastapi\
      \ import FastAPI, Response\n\napp = FastAPI()\n\n@app.post(\"/cookie-and-object/\")\ndef create_cookie(response:\
      \ Response):\n    response.set_cookie(key=\"fakesession\", value=\"fake-cookie-session-value\"\
      )\n    return {\"message\": \"Come to the dark side, we have cookies\"}\n```\n\nAnd then you\
      \ can return any object you need, as you normally would (a `dict`, a database model, etc).\n\
      \nAnd if you declared a `response_model`, it will still be used to filter and convert the object\
      \ you returned.\n\n**FastAPI** will use that *temporal* response to extract the cookies (also\
      \ headers and status code), and will put them in the final response that contains the value\
      \ you returned, filtered by any `response_model`."
