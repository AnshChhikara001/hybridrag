- question_id: lookup-009
  category: lookup
  question: How can I include custom headers when raising an HTTPException?
  answer: 'Pass a headers dict to HTTPException, e.g. raise HTTPException(status_code=404, detail="Item
    not found", headers={"X-Error": "There goes my error"})'
  spans:
  - relative_path: tutorial/handling-errors.md
    quote: "from fastapi import FastAPI, HTTPException\n\napp = FastAPI()\n\nitems = {\"foo\": \"\
      The Foo Wrestlers\"}\n\n@app.get(\"/items-header/{item_id}\")\nasync def read_item_header(item_id:\
      \ str):\n    if item_id not in items:\n        raise HTTPException(\n            status_code=404,\n\
      \            detail=\"Item not found\",\n            headers={\"X-Error\": \"There goes my error\"\
      },\n        )\n    return {\"item\": items[item_id]}"
  verified: false
- question_id: lookup-010
  category: lookup
  question: How do I create a global custom exception handler that returns a JSONResponse with status
    418?
  answer: 'Define a handler with @app.exception_handler(UnicornException) that returns JSONResponse(status_code=418,
    content={"message": ...})'
  spans:
  - relative_path: tutorial/handling-errors.md
    quote: "from fastapi import FastAPI, Request\nfrom fastapi.responses import JSONResponse\n\nclass\
      \ UnicornException(Exception):\n    def __init__(self, name: str):\n        self.name = name\n\
      \napp = FastAPI()\n\n@app.exception_handler(UnicornException)\nasync def unicorn_exception_handler(request:\
      \ Request, exc: UnicornException):\n    return JSONResponse(\n        status_code=418,\n   \
      \     content={\"message\": f\"Oops! {exc.name} did something. There goes a rainbow...\"},\n\
      \    )\n\n@app.get(\"/unicorns/{name}\")\nasync def read_unicorn(name: str):\n    if name ==\
      \ \"yolo\":\n        raise UnicornException(name=name)\n    return {\"unicorn_name\": name}"
  verified: false
- question_id: lookup-011
  category: lookup
  question: What do I specify in the decorator argument for identifying the webhook event?
  answer: Pass an identifier string like "new-subscription" to the decorator, which serves as the
    webhook name (event identifier).
  spans:
  - relative_path: advanced/openapi-webhooks.md
    quote: 'Notice that with webhooks you are actually not declaring a *path* (like `/items/`), the
      text you pass there is just an **identifier** of the webhook (the name of the event), for example
      in `@app.webhooks.post("new-subscription")`, the webhook name is `new-subscription`.

      This is because it is expected that **your users** would define the actual **URL path** where
      they want to receive the webhook request in some other way (e.g. a web dashboard).'
  verified: false
