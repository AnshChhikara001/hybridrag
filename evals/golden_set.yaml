  question: If I set cookies on a Response parameter in a dependency, will FastAPI include those cookies
    in the final response?
  answer: Yes - dependencies can set cookies on the temporal response, and FastAPI extracts them into
    the final response.
  spans:
  - relative_path: advanced/response-cookies.md
