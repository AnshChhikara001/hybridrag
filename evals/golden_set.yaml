- question_id: lookup-019
  category: lookup
  question: How do you define logic to run before the application starts and after it shuts down?
  answer: Use the `lifespan` parameter of the `FastAPI` app with an async context manager (function decorated
    with `@asynccontextmanager`) that yields.
  spans:
  - relative_path: advanced/events.md
    quote: |-
      You can define logic (code) that should be executed before the application **starts up**. This means that this code will be executed **once**, **before** the application **starts receiving requests**.

      The same way, you can define logic (code) that should be executed when the application is **shutting down**. In this case, this code will be executed **once**, **after** having handled possibly **many requests**.
  verified: true
- question_id: lookup-021
  category: lookup
  question: What happens to code placed after the `yield` in the lifespan async context manager?
  answer: It is executed after the application has finished handling requests, during shutdown, for cleaning
    up resources.
  spans:
  - relative_path: advanced/events.md
    quote: And then, right after the `yield`, we unload the model. This code will be executed **after**
      the application **finishes handling requests**, right before the *shutdown*. This could, for example,
      release resources like memory or a GPU.
  verified: true
- question_id: lookup-022
  category: lookup
  question: How do I convert a Pydantic model and its datetime fields into JSON-compatible Python data
    structures before storing in a database?
  answer: Use FastAPI's jsonable_encoder() to convert the model to JSON-compatible types, e.g., dict and
    ISO-format strings for datetimes.
  spans:
  - relative_path: tutorial/encoder.md
    quote: |-
      There are some cases where you might need to convert a data type (like a Pydantic model) to something compatible with JSON (like a `dict`, `list`, etc).

      For example, if you need to store it in a database.

      For that, **FastAPI** provides a `jsonable_encoder()` function.
  verified: true
- question_id: lookup-023
  category: lookup
  question: What does jsonable_encoder return when given a Pydantic model with datetime fields?
  answer: It returns a Python data structure (like a dict) with values converted to JSON-compatible types,
    such as datetime converted to ISO-format strings.
  spans:
  - relative_path: tutorial/encoder.md
    quote: |-
      In this example, it would convert the Pydantic model to a `dict`, and the `datetime` to a `str`.

      The result of calling it is something that can be encoded with the Python standard `json.dumps()`.

      It doesn't return a large `str` containing the data in JSON format (as a string). It returns a Python standard data structure (e.g. a `dict`) with values and sub-values that are all compatible with JSON.
  verified: true
- question_id: multi_hop-002
  category: multi_hop
  question: If I mount a sub-application at /subapi and also run behind a proxy that serves the app under
    /api/v1, how will the sub-application know to use the combined prefix so its docs UI is fetched from
    /api/v1/subapi/docs?
  answer: 'You must rely on ASGI root_path handling: FastAPI sets root_path for mounted sub-apps and the
    server/proxy can pass an external root_path so the browser-facing docs use the combined prefix.'
  spans:
  - relative_path: advanced/sub-applications.md
    quote: |-
      When you mount a sub-application as described above, FastAPI will take care of communicating the mount path for the sub-application using a mechanism from the ASGI specification called a `root_path`.
      That way, the sub-application will know to use that path prefix for the docs UI.
  - relative_path: advanced/behind-a-proxy.md
    quote: |-
      The `root_path` is a mechanism provided by the ASGI specification (that FastAPI is built on, through Starlette).

      The `root_path` is used to handle these specific cases.

      And it's also used internally when mounting sub-applications.

      Having a proxy with a stripped path prefix, in this case, means that you could declare a path at `/app` in your code, but then, you add a layer on top (the proxy) that would put your **FastAPI** application under a path like `/api/v1`.
  verified: true
- question_id: multi_hop-005
  category: multi_hop
  question: If I want to accept partial updates without accidentally overwriting stored fields with model
    defaults and also ensure the response is validated and filtered by a Pydantic model when returning
    the updated item, what combination of techniques from both endpoints should I apply?
  answer: Use PATCH with exclude_unset to build update_data and model_copy/update on stored model, then
    return it with a response_model so FastAPI validates and filters the returned data.
  spans:
  - relative_path: tutorial/body-updates.md
    quote: |-
      If you want to receive partial updates, it's very useful to use the parameter `exclude_unset` in Pydantic's model's `.model_dump()`.

      Like `item.model_dump(exclude_unset=True)`.
  - relative_path: tutorial/response-model.md
    quote: FastAPI will use this `response_model` to do all the data documentation, validation, etc. and
      also to **convert and filter the output data** to its type declaration.
  verified: true
- question_id: multi_hop-006
  category: multi_hop
  question: If I mount a StaticFiles instance at "/static" on my main FastAPI app and also mount a separate
    FastAPI sub-application at "/subapi", will the OpenAPI docs at "/docs" include the static files mount
    or the sub-application's path operations?
  answer: 'You must combine both behaviors: mounted static files are a mounted sub-application and mounted
    sub-applications (including StaticFiles) are independent, so the main app''s docs won''t include them.'
  spans:
  - relative_path: tutorial/static-files.md
    quote: |-
      "Mounting" means adding a complete "independent" application in a specific path, that then takes care of handling all the sub-paths.

      This is different from using an `APIRouter` as a mounted application is completely independent. The OpenAPI and docs from your main application won't include anything from the mounted application, etc.
  - relative_path: advanced/sub-applications.md
    quote: '"Mounting" means adding a completely "independent" application in a specific path, that then
      takes care of handling everything under that path, with the _path operations_ declared in that sub-application.'
  verified: true
- question_id: multi_hop-008
  category: multi_hop
  question: If I want to both set cookies in a response and have the response documented in OpenAPI with
    a specific media type, how can I both set cookies and ensure the response_class media type is included
    in the automatic docs?
  answer: You declare a Response parameter (or return a Response) to set cookies and also set response_class
    in the path operation decorator so FastAPI can document the media type in OpenAPI.
  spans:
  - relative_path: advanced/response-cookies.md
    quote: |-
      You can declare a parameter of type `Response` in your *path operation function*.

      And then you can set cookies in that *temporal* response object.
  - relative_path: advanced/custom-response.md
    quote: |-
      If you want to override the response from inside of the function but at the same time document the "media type" in OpenAPI, you can use the `response_class` parameter AND return a `Response` object.

      The `response_class` will then be used only to document the OpenAPI *path operation*, but your `Response` will be used as is.
  verified: true
