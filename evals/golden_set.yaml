- question_id: lookup-005
  category: lookup
  question: Why do I need to use Form when declaring form bodies instead of relying on default parameter
    behavior?
  answer: Because without it the parameters would be interpreted as query parameters or body (JSON) parameters.
  spans:
  - relative_path: tutorial/request-forms.md
    quote: |-
      `Form` is a class that inherits directly from `Body`.

      To declare form bodies, you need to use `Form` explicitly, because without it the parameters would be interpreted as query parameters or body (JSON) parameters.
  verified: true
- question_id: lookup-006
  category: lookup
  question: Can I declare both Form parameters and JSON Body fields in the same path operation?
  answer: No, you can't also declare `Body` fields that you expect to receive as JSON, as the request
    will have the body encoded using `application/x-www-form-urlencoded` instead of `application/json`.
  spans:
  - relative_path: tutorial/request-forms.md
    quote: |-
      You can declare multiple `Form` parameters in a *path operation*, but you can't also declare `Body` fields that you expect to receive as JSON, as the request will have the body encoded using `application/x-www-form-urlencoded` instead of `application/json`.

      This is not a limitation of **FastAPI**, it's part of the HTTP protocol.
  verified: true
- question_id: lookup-009
  category: lookup
  question: How can I include custom headers when raising an HTTPException?
  answer: 'Pass a headers dict to HTTPException, e.g. raise HTTPException(status_code=404, detail="Item
    not found", headers={"X-Error": "There goes my error"})'
  spans:
  - relative_path: tutorial/handling-errors.md
    quote: |-
      @app.get("/items-header/{item_id}")
      async def read_item_header(item_id: str):
          if item_id not in items:
              raise HTTPException(
                  status_code=404,
                  detail="Item not found",
                  headers={"X-Error": "There goes my error"},
              )
          return {"item": items[item_id]}
  verified: true
