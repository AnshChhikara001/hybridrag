- question_id: multi_hop-014
  category: multi_hop
  question: How should I annotate a function parameter to accept both form fields and uploaded files in
    the same POST endpoint and why can't I also expect JSON Body fields in that endpoint?
  answer: Use File and Form (e.g., Annotated[bytes, File()] and Annotated[str, Form()]) together because
    the request will be encoded as multipart/form-data, so you cannot declare Body fields expecting application/json
    in the same operation.
  spans:
  - relative_path: tutorial/request-forms-and-files.md
    quote: Use `File` and `Form` together when you need to receive data and files in the same request.
  - relative_path: tutorial/request-files.md
    quote: |-
      You can declare multiple `File` and `Form` parameters in a *path operation*, but you can't also declare `Body` fields that you expect to receive as JSON, as the request will have the body encoded using `multipart/form-data` instead of `application/json`.

      This is not a limitation of **FastAPI**, it's part of the HTTP protocol.
  verified: true
